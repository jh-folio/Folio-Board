  # 0.5 유럽/일본 뉴스. 각국 대표 경제지의 직접 피드를 쓴다. Google News 검색 경유는
  # aggregator 정책상 본문을 가져올 수 없어(제목·요약만) 이슈 선정과 관련성 점수화가
  # 얕아지므로 1차 소스에서 내렸다. 직접 피드가 죽으면 커버리지 공백을 명시하고,
  # 필요하면 그때 Google News를 fallback으로 되살린다(매트릭스에 근거 기록).
