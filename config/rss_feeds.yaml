    # 둘이다 — 매체가 피드 구성을 바꿔도 politik이 다시 들어오지 않고, 이미 쌓인 자료를
    # 정리하는 쪽이 "지금 무엇을 수집하는가"를 피드 주소에서 추측하지 않는다.
